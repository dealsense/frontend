[prompts]
img_description = You are an expert analyst tasked with describing data visualizations with absolute precision
JSON Output Schema:{schema}
Instructions:
Respond strictly in JSON format as per the schema above.
The description should be highly detailed and must include all the information present in the image.
Create structured_data capturing every data point/segment only for charts with discrete points (line, bar, scatter, pie). Below are the guidelines:
1. Include a tag for each entry indicating whether the value is 'Exact' or 'Approximate.'
2. Capture all textual annotations present in the chart, such as labels, titles, legends, and notes.

table_json_content = You are a Data Annotator. Extract all the details from given image and its corresponding OCR output. Represent the information in JSON format.
Follow the instructions given below:
1. Use your understanding to create an appropriate JSON schema.
2. Use the OCR output to ensure the accuracy of text and numerical data, and cross-reference it with the table image for validation.
3. Be careful when extracting numbers and IDs present in the image.
4. Ensure the output is complete, covering all data extracted from the image and avoid speculative content.
<ocr_text>
```
{ocr_text}
```
<ocr_text>

table_json_description = You are an expert in explaining the Json data accurate and concisely. Provide the explaination for the below-
{table_json} 

qna_v1 = Context information is below for answering the question.
Context:
----------------------
{context_str}
----------------------
**Given the context information answer the query.**
Query: {query_str}

qna_v2 = Context information is below for answering the question.
Context:
----------------------
{context_str}
----------------------
**Given the context information answer the query in a concise and factually accurate manner**
Query: {query_str}
Instructions:
Only use information explicitly stated in the context
Cover all points needed to answer the query

multimodal_qna_v1 = You are an assistant that answers questions based on a combination of provided text and charts.
<context>
{context_str}
</context>
Using the above context, answer the following question as accurately as possible. The answer may come from the text, the chart, or a combination of both. 
If the answer is not present in the context, respond with: "Not found in context."
Question: {query_str}
Answer:

[models]
text_model = gpt-4o
qna = gpt-4.1
table_content_extraction = gpt-4.1
multimodal_qna = o3
img_description = o4-mini
doclayout = doclayout/doclayout_yolo_docstructbench_imgsz1024.pt
embedding_model = text-embedding-ada-002
reranker_model = cohere.rerank-v3-5:0
LLM_as_a_judge = gpt-4o

[embedding_parameters]
embedding_batch_size = 1000
embedding_dimension = 1536

[thresholds]
remove_toc = 0.4
table = 0.5
DocLayout = 0.4
pad_image_portrait_xaxis = 60
pad_image_portrait_yaxis = 300
pad_image_landscape_xaxis = 160
pad_image_landscape_yaxis = 250
compare_area = 0.45
image_quality = 95
qna_dedupe_fuzzy = 95
evaluation_fuzzy_threshold = 90

[other_parameters]
top_k = 20
top_rerank = 7
max_new_tokens = 6000
max_length = 10000
temperature = 0.1
max_tokens = 10000
sentence_window_size = 3
pinecone_upsert_batch_size = 100
table_max_token = 2500
