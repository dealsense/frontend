name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholder — this job only verifies the app compiles, it doesn't deploy,
          # so the real backend URL doesn't matter here (Vercel's own build uses the
          # real value configured in its project settings).
          NEXT_PUBLIC_API_URL: http://localhost:8000
